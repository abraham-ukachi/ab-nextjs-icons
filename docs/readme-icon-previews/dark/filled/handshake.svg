<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <defs>
    <mask id="handshakeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <!-- left cuff bar (isolated) -->
      <path d="M2.5 8.5v6" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
      <!-- right cuff bar (isolated) -->
      <path d="M21.5 8.5v6" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
      <!-- hand/wrist body: same geometry as outlined but WITHOUT the cuff stubs;
           start after the ≥1.5px gap from cuffs (x≈5.0 / x≈19.0) -->
      <!-- left top wrist → clasp -->
      <path d="M5.2 10 L5.7 10 l3.6-3.1a2 2 0 0 1 2.2-.3l2.2 1.1"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- right top wrist → clasp + overlap into left palm -->
      <path d="M18.8 10 L18.5 10 l-3.4-2.6a2 2 0 0 0-2.1-.2L9.4 9.3a1.3 1.3 0 0 0 .2 2.3 1.6 1.6 0 0 0 1.6-.3l1.4-1.1 5 4.4"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- bottom finger scallops (grown) -->
      <path d="M5.2 13.5 L5.5 13.5 l3.2 3a1.2 1.2 0 0 0 1.8-1.6"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.5 14.9l1.4 1.3a1.2 1.2 0 0 0 1.8-1.6"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.7 14.6l.8.8a1.2 1.2 0 0 0 1.8-1.6L15 12.5"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- right bottom wrist -->
      <path d="M18.2 14.2 H18.8"
            fill="none" stroke="#fff" stroke-width="2.35" stroke-linecap="round"/>
      <!-- solid-ish fill of palm/clasp interior (bridge the grown strokes) -->
      <path d="M7.2 9.2 L11.0 7.2 L14.5 7.8 L16.5 10.5 L14.8 14.2 L11.2 15.8 L7.8 13.8 Z"
            fill="#fff"/>
      <!-- cuff↔hand gaps: cut any bleed (black) to enforce ≥1.5px -->
      <rect x="3.55" y="7.5" width="1.55" height="8.5" fill="#000"/>
      <rect x="18.9" y="7.5" width="1.55" height="8.5" fill="#000"/>
      <!-- finger separation knockouts ≥1.4px -->
      <path d="M9.6 14.2 L10.4 15.6" stroke="#000" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M12.4 14.0 L13.2 15.5" stroke="#000" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M14.8 13.2 L15.5 14.6" stroke="#000" stroke-width="1.45" stroke-linecap="round"/>
      <!-- thumb / back-of-hand overlap line ≥1.4px -->
      <path d="M9.6 9.6 L11.8 10.8 L14.5 13.2" stroke="#000" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="24" height="24" fill="#e6edf3" mask="url(#handshakeMask)"/>
</svg>
