<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <defs>
    <mask id="handshakeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <!-- left cuff -->
      <path d="M2.2 12.2 H8.0 V15.0 H2.2 Z" fill="#fff" stroke="#fff" stroke-width="1.85" stroke-linejoin="round"/>
      <!-- left hand coming right-up -->
      <path d="M7.2 12.2 L13.0 9.2 L16.5 11.0 L15.2 13.8 L11.0 12.0 L7.2 15.0 Z" fill="#fff" stroke="#fff" stroke-width="1.85" stroke-linejoin="round"/>
      <!-- right cuff -->
      <path d="M16.0 13.8 H21.8 V16.6 H16.0 Z" fill="#fff" stroke="#fff" stroke-width="1.85" stroke-linejoin="round"/>
      <!-- right hand coming left-down, overlapping -->
      <path d="M16.8 13.8 L11.0 11.5 L7.5 13.0 L8.8 15.8 L12.8 14.2 L16.8 16.6 Z" fill="#fff" stroke="#fff" stroke-width="1.85" stroke-linejoin="round"/>
      <!-- fingers wrapping over -->
      <path d="M10.0 10.5 L10.6 7.8" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M11.5 10.0 L12.3 7.2" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M13.0 10.2 L14.0 7.5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M14.5 10.8 L15.8 8.2" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="24" height="24" fill="currentColor" mask="url(#handshakeMask)"/>
</svg>
